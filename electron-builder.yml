appId: com.gino.jarvis
productName: Jarvis
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  # Los códigos chilenos, ya bajados de LeyChile. Sin esto el buscador de
  # artículos queda vacío en la app empaquetada.
  - recursos/**
mac:
  category: public.app-category.education
  target:
    # zip, no dmg: el dmg sólo se puede empaquetar desde macOS.
    - target: zip
      arch:
        - arm64
        - x64
  icon: build/icon.png
  identity: null # sin firma de Apple
